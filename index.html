<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon-Says Game</title>
    <link rel="icon" href="simonLogo.png">
    <link rel="stylesheet" href="Simon.css">
</head>
<body>
    <div class="score-board">
    <div class="live"><mark>Live Score: <span>0</span></mark></div>
    <div class="high"><mark>High score: <span>0</span></mark></div>
    </div>
    <h1>Simon Game</h1>
    <h3>Press Enter or Tap to start the game</h3>
    <div class="boxContainer">
        <div class="lineone">
         <div class="btn red" type="button" id="red"></div>
         <div class="btn green" type="button" id="green"></div>
        </div>
       <div class="linetwo">
         <div class="btn yellow" type="button" id="yellow"></div>
        <div class="btn blue" type="button" id="blue"></div>
       </div>
       
    </div>
    <script src="Simon.js"></script>
</body>
</html>
